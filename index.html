<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hub Diagram / Stroke Diagram</title>

<!-- Chart.js v4 + Annotation Plugin -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@2.2.1/dist/chartjs-plugin-annotation.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- XLSX für Export/Import -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
    body { font-family: Arial, sans-serif; background-color:#f5f5f5; padding: 20px; }
    h2 { text-align:center; margin-bottom:20px; }
    .container { max-width:1000px; margin:0 auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.1); }
    .form-group { display:flex; flex-wrap:wrap; align-items:center; margin-bottom:15px; gap:10px; }
    .form-group label { margin-right:10px; min-width:120px; }
    .form-group input, .form-group select { padding:5px 10px; border-radius:5px; border:1px solid #ccc; }
    button { padding:6px 12px; border:none; border-radius:5px; background:#0077b5; color:white; cursor:pointer; transition:0.2s; flex-shrink:0; }
    button:hover { background:#005f8d; }
    table { border-collapse: collapse; margin-top: 10px; width:100%; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align:center; }
    th { background:#0077b5; color:white; }
    #myChart { margin-top:20px; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); padding:15px; }
    .footer-link { margin-top:20px; font-size:14px; text-align:center; }
    .footer-link a { display:inline-block; padding:5px 10px; background:#0077b5; color:white; border-radius:5px; text-decoration:none; font-weight:bold; transition:0.2s; }
    .footer-link a:hover { background:#005f8d; }
</style>
</head>
<body>
<div class="container">
<h2>Hub-Diagramm / Stroke Diagram</h2>

<div class="form-group">
    <label for="movementName">Bewegung Name / Movement Name: </label>
    <input type="text" id="movementName">
    <button id="addMovementBtn">Neue Bewegung / New Movement</button>
</div>

<div class="form-group">
    <label for="movementSelect">Bearbeite Bewegung / Edit Movement: </label>
    <select id="movementSelect"></select>
</div>

<div class="form-group">
    <label for="cycleDuration">Zykluszeit (s) / Cycle Time (s): </label>
    <input type="number" id="cycleDuration" min="0" step="0.1" value="1">
</div>

<!-- Eingabe für vertikale Linie -->
<div class="form-group">
    <label for="verticalLineX">Vertikale Linie bei X (°): </label>
    <input type="number" id="verticalLineX" min="0" max="360">
    <button id="addLineBtn">Linie hinzufügen</button>
</div>

<div class="form-group">
    <label for="xCoord">X (0-360°): </label>
    <input type="number" id="xCoord" min="0" max="360">
    <label for="yCoord">Y: </label>
    <input type="number" id="yCoord">
    <button id="addPointBtn">Hinzufügen / Update</button>
</div>

<h3>Bewegungen ein-/ausblenden / Show/Hide Movements:</h3>
<div id="toggleMovements"></div>

<table id="pointsTable">
    <thead>
        <tr><th>#</th><th>X</th><th>Y</th><th>Aktionen / Actions</th></tr>
    </thead>
    <tbody></tbody>
</table>

<canvas id="myChart" width="900" height="400"></canvas>

<div style="text-align:center; margin-top:20px;">
    <button id="exportPDFBtn">Diagramm als A3 PDF speichern / Save as A3 PDF</button>
    <button id="exportExcelBtn">📤 Daten exportieren (Excel)</button>
    <input type="file" id="importExcelInput" style="display:none" accept=".xlsx">
    <button id="importExcelBtn">📥 Daten importieren (Excel)</button>
    <button id="clearAllBtn" style="background:#ff5555;">🧹 Alles löschen</button>
</div>

<!-- Neue Reihe: FreeCAD Makro Export -->
<div style="text-align:center; margin-top:10px;">
    <button id="exportMacroBtn">🧩 FreeCAD Makro (.FCMacro)</button>
</div>

<div class="footer-link">
    Developed by Eng. Zaher Taleb | 
    <a href="https://www.youtube.com/@Zaher.Taleb.mechanical.design" target="_blank">🎥 Visit my YouTube Channel</a>
</div>
</div>

<script>
// Chart.js Plugin registrieren
Chart.register(window['chartjs-plugin-annotation']);

const colors = ['#0077b5','#ff6f61','#6a5acd','#ffa500','#2e8b57','#ff1493','#20b2aa','#8b4513'];
let movements = [];
let currentMovementIndex = null;
let editingIndex = null;
let cycleDuration = 1;

const ctx = document.getElementById('myChart').getContext('2d');
const chart = new Chart(ctx, {
    type: 'line',
    data: { datasets: [] },
    options: {
        scales: {
            x: { type: 'linear', min:0, max:360, ticks:{stepSize:10, callback:formatXAxisTick}, title:{display:true,text:'Winkel (°) & Zeit (ms) / Angle (°) & Time (ms)'} },
            y: { beginAtZero:true, title:{display:true,text:'Hub (mm) / Stroke (mm)'} }
        },
        plugins: { 
            legend:{ display:true, position:'top' },
            annotation: { annotations: {} }
        }
    },
    plugins: [{
        id: 'fullChartBorder',
        afterDraw: chart => {
            const ctx = chart.ctx;
            ctx.save();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            const borderPadding = 10;
            const area = chart.chartArea;
            ctx.strokeRect(
                area.left - borderPadding,
                area.top - borderPadding,
                (area.right - area.left) + 2*borderPadding,
                (area.bottom - area.top) + 2*borderPadding
            );
            ctx.restore();
        }
    }]
});

// --- Speicherfunktionen ---
function saveData() {
    localStorage.setItem('movements', JSON.stringify(movements));
    localStorage.setItem('cycleDuration', cycleDuration);
}

function loadData() {
    const savedMovements = localStorage.getItem('movements');
    const savedCycleDuration = localStorage.getItem('cycleDuration');

    if (savedMovements) {
        movements = JSON.parse(savedMovements);
        cycleDuration = parseFloat(savedCycleDuration) || 1;

        chart.data.datasets = movements.map(m => m.dataset);
        chart.update();

        updateMovementSelect();
        updateToggleMovements();
        if (movements.length > 0) {
            currentMovementIndex = 0;
            refreshTable();
        }
    }
}

// --- Funktionen ---
function addMovement() {
    const name = document.getElementById('movementName').value.trim();
    if(!name){ alert('Bitte einen Namen eingeben / Please enter a name.'); return;}
    const color = colors[movements.length % colors.length];
    const dataset = { label: name, data: [{x:0,y:0}], borderColor: color, fill:false, tension:0 };
    movements.push({name, dataset, points:[{x:0,y:0}], visible:true});
    chart.data.datasets.push(dataset);
    chart.update();
    document.getElementById('movementName').value='';
    updateMovementSelect();
    updateToggleMovements();
    currentMovementIndex = movements.length-1;
    refreshTable();
    saveData();
}

function updateMovementSelect(){
    const select = document.getElementById('movementSelect');
    select.innerHTML='';
    movements.forEach((m,i)=>{
        const opt=document.createElement('option');
        opt.value=i; opt.text=m.name; select.appendChild(opt);
    });
    if(currentMovementIndex!==null) select.value=currentMovementIndex;
}

function selectMovement(){
    const select = document.getElementById('movementSelect');
    currentMovementIndex=parseInt(select.value);
    editingIndex=null;
    refreshTable();
}

function formatXAxisTick(value){
    const timeMs = cycleDuration > 0 ? (value / 360) * cycleDuration * 1000 : 0;
    return `${value}° (${timeMs.toFixed(0)}ms)`;
}

function updateCycleDuration(){
    const input = document.getElementById('cycleDuration');
    const newDuration = parseFloat(input.value);
    cycleDuration = newDuration > 0 ? newDuration : 0;
    chart.update();
    saveData();
}

function refreshTable(){
    const tbody = document.querySelector('#pointsTable tbody');
    tbody.innerHTML = '';
    if(currentMovementIndex===null) return;
    const movement = movements[currentMovementIndex];
    movement.points.slice(1).forEach((point, index) => {
        const row = document.createElement('tr');
        const tdIndex = document.createElement('td'); tdIndex.textContent = index + 1;
        const tdX = document.createElement('td'); tdX.textContent = point.x;
        const tdY = document.createElement('td'); tdY.textContent = point.y;
        const tdActions = document.createElement('td');

        const btnEdit = document.createElement('button');
        btnEdit.textContent = 'Bearbeiten / Change';
        btnEdit.addEventListener('click', () => editPoint(index));

        const btnDelete = document.createElement('button');
        btnDelete.textContent = 'Löschen / Delete';
        btnDelete.addEventListener('click', () => deletePoint(index));

        tdActions.appendChild(btnEdit);
        tdActions.appendChild(btnDelete);

        row.appendChild(tdIndex);
        row.appendChild(tdX);
        row.appendChild(tdY);
        row.appendChild(tdActions);
        tbody.appendChild(row);
    });
}

function addOrUpdatePoint(){
    if(currentMovementIndex===null){ alert('Bitte zuerst eine Bewegung erstellen / Please create a movement first.'); return;}
    const x = parseFloat(document.getElementById('xCoord').value);
    const y = parseFloat(document.getElementById('yCoord').value);
    if(isNaN(x)||isNaN(y)||x<0||x>360){
        alert('Bitte gültige X (0-360) und Y Werte eingeben / Please enter valid X (0-360) and Y values.');
        return;
    }
    const movement = movements[currentMovementIndex];
    if(editingIndex!==null){ 
        movement.points[editingIndex+1]={x,y}; 
        editingIndex=null; 
    } else { 
        movement.points.push({x,y}); 
    }

    // ✅ sort & dedupe by angle to avoid duplicate [0,0] etc.
    movement.points.sort((a,b)=>a.x-b.x);
    const clean = [];
    let lastX = null;
    movement.points.forEach(p=>{
        if(p.x !== lastX){
            clean.push(p);
            lastX = p.x;
        }
    });
    movement.points = clean;

    movement.dataset.data = movement.points;
    chart.update();
    refreshTable();
    document.getElementById('xCoord').value='';
    document.getElementById('yCoord').value='';
    saveData();
}

function editPoint(index){
    const movement = movements[currentMovementIndex];
    const point = movement.points[index+1];
    document.getElementById('xCoord').value = point.x;
    document.getElementById('yCoord').value = point.y;
    editingIndex = index;
}

function deletePoint(index){
    const movement = movements[currentMovementIndex];
    movement.points.splice(index+1,1);
    movement.dataset.data = movement.points;
    chart.update();
    refreshTable();
    saveData();
}

function updateToggleMovements(){
    const div=document.getElementById('toggleMovements');
    div.innerHTML='';
    movements.forEach((m,i)=>{
        const checkbox=document.createElement('input');
        checkbox.type='checkbox'; checkbox.checked=m.visible;
        checkbox.id='toggle_'+i;
        checkbox.addEventListener('change', ()=>toggleMovement(i, checkbox.checked));
        const label=document.createElement('label');
        label.htmlFor='toggle_'+i; label.innerText=m.name;
        div.appendChild(checkbox); div.appendChild(label); div.appendChild(document.createTextNode(' '));
    });
}

function toggleMovement(index, visible){
    movements[index].visible=visible;
    chart.data.datasets[index].hidden = !visible;
    chart.update();
    saveData();
}

function exportPDF(){
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a3' });
    const canvas = document.getElementById('myChart');
    const imgData = canvas.toDataURL('image/png', 1.0);
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 15;
    const pdfWidth = pageWidth - 2*margin;
    const pdfHeight = pageHeight - 2*margin;
    pdf.addImage(imgData, 'PNG', margin, margin, pdfWidth, pdfHeight);
    const footerText = "Developed by Eng. Zaher Taleb | Visit my YouTube Channel";
    const linkURL = "https://www.youtube.com/@Zaher.Taleb.mechanical.design";
    pdf.setFontSize(12);
    const textWidth = pdf.getTextWidth(footerText);
    const xPos = (pageWidth - textWidth) / 2;
    const yPos = pageHeight - 10;
    pdf.text(footerText, xPos, yPos);
    pdf.link(xPos, yPos - 5, textWidth, 10, { url: linkURL });
    pdf.save('Hub_Diagram_A3.pdf');
}

// --- Vertikale Linie hinzufügen ---
function addVerticalLine() {
    const xValue = parseFloat(document.getElementById('verticalLineX').value);
    if (isNaN(xValue) || xValue < 0 || xValue > 360) {
        alert('Bitte einen gültigen X-Wert zwischen 0 und 360 eingeben.');
        return;
    }

    chart.options.plugins.annotation.annotations = {
        taktLine: {
            type: 'line',
            xMin: xValue,
            xMax: xValue,
            borderColor: 'red',
            borderWidth: 2,
            label: {
                display: true,
                content: 'Maschine-Taktet',
                position: 'start',
                backgroundColor: 'rgba(255,0,0,0.7)',
                color: 'white',
                font: { weight: 'bold' }
            }
        }
    };
    chart.update();
}

/* ========= FreeCAD Macro Export (Cam, smooth) ========= */
function exportFreeCADMacro() {
    if (currentMovementIndex === null) {
        alert("Bitte zuerst eine Bewegung auswählen.");
        return;
    }

    const movement = movements[currentMovementIndex];
    let pts = movement.points.slice();
    if (pts.length < 2){
        alert("Nicht genug Punkte für ein Makro.");
        return;
    }

    // sort & dedupe by angle
    pts.sort((a,b)=>a.x-b.x);
    const clean = [];
    let lastX = null;
    pts.forEach(p=>{
        if (p.x !== lastX) {
            clean.push(p);
            lastX = p.x;
        }
    });

    // ensure 0° and 360° exist
    if (clean[0].x > 0) clean.unshift({x:0, y:clean[0].y});
    if (clean[clean.length-1].x < 360) clean.push({x:360, y:clean[clean.length-1].y});

    let pyPoints = "";
    clean.forEach(p=>{
        pyPoints += `    [${p.x}, ${p.y}],\n`;
    });

    const macro = `
import FreeCAD as App
import Part, math

motion_points = [
${pyPoints}
]

# sort and remove duplicate angles
motion_points = sorted(motion_points, key=lambda p: p[0])
clean = []
last = None
for a, y in motion_points:
    if a != last:
        clean.append([a, y])
        last = a
motion_points = clean

# ensure 0° and 360° exist
if motion_points[0][0] > 0:
    motion_points.insert(0, [0, motion_points[0][1]])
if motion_points[-1][0] < 360:
    motion_points.append([360, motion_points[-1][1]])

base_radius   = 125.0
step_angle    = 0.5
angle_offset  = 180.0
cam_thickness = 12.0

def smoothstep(a, a1, a2, y1, y2):
    t = (a - a1) / (a2 - a1)
    return y1 + (y2 - y1) * (3*t*t - 2*t*t*t)

def lift_at(a):
    for i in range(len(motion_points)-1):
        a1, y1 = motion_points[i]
        a2, y2 = motion_points[i+1]
        if a1 <= a <= a2:
            return smoothstep(a, a1, a2, y1, y2)
    return motion_points[-1][1]

points = []
a = 0.0
while a <= 360.0:
    L = lift_at(a)
    r = base_radius + L
    t = math.radians(-(a + angle_offset))
    x = r * math.cos(t)
    y = r * math.sin(t)
    points.append(App.Vector(x, y, 0))
    a += step_angle

points.append(points[0])

wire = Part.makePolygon(points)
face = Part.Face(wire)
solid = face.extrude(App.Vector(0,0,cam_thickness))

doc = App.newDocument("CamProfile")
obj = doc.addObject("Part::Feature", "CamSolid")
obj.Shape = solid
doc.recompute()

print("Cam created successfully with", len(points), "points.")
`;

    const blob = new Blob([macro], { type: "text/plain" });
    const aLink = document.createElement("a");
    aLink.href = URL.createObjectURL(blob);
    aLink.download = (movement.name || "GenerateCam") + ".FCMacro";
    aLink.click();
}

// --- NEUE FUNKTIONEN ---

// 🧹 Alles löschen
function clearAll() {
    if (!confirm("Bist du sicher, dass du alle Daten löschen willst?")) return;
    localStorage.clear();
    movements = [];
    chart.data.datasets = [];
    chart.update();
    updateMovementSelect();
    updateToggleMovements();
    document.querySelector('#pointsTable tbody').innerHTML = '';
    alert("Alle Daten wurden gelöscht!");
}

// 📤 Export nach Excel
function exportToExcel() {
    if (movements.length === 0) { alert("Keine Daten zum Exportieren."); return; }

    let wb = XLSX.utils.book_new();
    movements.forEach(m => {
        let sheetData = [["X", "Y"]];
        m.points.forEach(p => sheetData.push([p.x, p.y]));
        let ws = XLSX.utils.aoa_to_sheet(sheetData);
        XLSX.utils.book_append_sheet(wb, ws, m.name.substring(0, 31));
    });
    XLSX.writeFile(wb, "HubDiagram_Data.xlsx");
}

// 📥 Import aus Excel
function importFromExcel(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        movements = [];
        chart.data.datasets = [];
        workbook.SheetNames.forEach((name, i) => {
            const ws = workbook.Sheets[name];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
            const color = colors[i % colors.length];
            const points = rows.slice(1).map(r => ({x: parseFloat(r[0]), y: parseFloat(r[1])})).filter(p => !isNaN(p.x));
            const dataset = { label: name, data: points, borderColor: color, fill:false, tension:0 };
            movements.push({ name, dataset, points, visible:true });
            chart.data.datasets.push(dataset);
        });
        chart.update();
        updateMovementSelect();
        updateToggleMovements();
        refreshTable();
        saveData();
        alert("Daten erfolgreich importiert!");
    };
    reader.readAsArrayBuffer(file);
}

// --- Event Listener ---
document.getElementById('addMovementBtn').addEventListener('click', addMovement);
document.getElementById('movementSelect').addEventListener('change', selectMovement);
document.getElementById('addPointBtn').addEventListener('click', addOrUpdatePoint);
document.getElementById('cycleDuration').addEventListener('input', updateCycleDuration);
document.getElementById('exportPDFBtn').addEventListener('click', exportPDF);
document.getElementById('addLineBtn').addEventListener('click', addVerticalLine);
document.getElementById('clearAllBtn').addEventListener('click', clearAll);
document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
document.getElementById('importExcelBtn').addEventListener('click', () => document.getElementById('importExcelInput').click());
document.getElementById('importExcelInput').addEventListener('change', e => importFromExcel(e.target.files[0]));
document.getElementById('exportMacroBtn').addEventListener('click', exportFreeCADMacro);

// --- Beim Start gespeicherte Daten laden ---
loadData();
</script>
</body>
</html>
